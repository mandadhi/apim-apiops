openapi: 3.0.1
info:
  title: Weather
  description: 'Weather Forecast API'
  contact:
    name: API Support
    email: harshavardhanreddy1715@gmail.com
  version: '1.0'
servers:
  - url: https://ci-cd-apim-instance.azure-api.net/wt
paths:
  /weatherforecast:
    get:
      tags:
        - WebApplication1
      summary: GetWeatherForecast
      description: Retrieves the complete weather forecast collection.
      operationId: GetWeatherForecast
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WeatherForecast'
              example:
                - date: '2026-09-21'
                  temperatureC: 0
                  summary: string
                  temperatureF: 0
  '/weatherforecast/{weatherForecastId}':
    get:
      tags:
        - WebApplication1
      summary: '/weatherforecast/{weatherForecastId} - GET'
      description: Retrieves a single weather forecast by its weather forecast identifier.
      operationId: GetWeatherForecastByWeatherForecastId
      parameters:
        - name: weatherForecastId
          in: path
          required: true
          description: Unique identifier of the weather forecast to retrieve.
          schema:
            type: string
      responses:
        '200':
          description: OK
  /error:
    get:
      tags:
        - WebApplication1
      summary: /error - GET
      description: Exercises the API error response endpoint for diagnostics.
      operationId: GetError
      responses:
        '200':
          description: OK
  /serviceerror:
    get:
      tags:
        - WebApplication1
      summary: /serviceerror - GET
      description: Exercises the service error response endpoint for diagnostics.
      operationId: GetServiceError
      responses:
        '200':
          description: OK
components:
  schemas:
    WeatherForecast:
      type: object
      properties:
        date:
          type: string
          format: date
        temperatureC:
          type: integer
          format: int32
        summary:
          type: string
          nullable: true
        temperatureF:
          type: integer
          format: int32
          readOnly: true
      additionalProperties: false
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
    apiKeyQuery:
      type: apiKey
      name: subscription-key
      in: query
security:
  - apiKeyHeader: [ ]
  - apiKeyQuery: [ ]
tags:
  - name: WebApplication1