openapi: 3.0.1
info:
  title: Weather
  version: '1.0'
servers:
  - url: https://ci-cd-apim-instance.azure-api.net/wt
paths:
  /weatherforecast:
    get:
      tags:
        - WebApplication1
      summary: GetWeatherForecast
      operationId: GetWeatherForecast
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WeatherForecast'
              example:
                - date: string
                  temperatureC: 0
                  summary: string
                  temperatureF: 0
  '/weatherforecast/{id}':
    get:
      tags:
        - WebApplication1
      summary: '/weatherforecast/{id} - GET'
      operationId: get-weatherforecast-id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /error:
    get:
      tags:
        - WebApplication1
      summary: /error - GET
      operationId: get-error
      responses:
        '200':
          description: OK
  /serviceerror:
    get:
      tags:
        - WebApplication1
      summary: /serviceerror - GET
      operationId: get-serviceerror
      responses:
        '200':
          description: OK
components:
  schemas:
    Project:
      type: object
      properties:
        name:
          type: string
          nullable: true
      additionalProperties: false
    WeatherForecast:
      type: object
      properties:
        date:
          type: string
          format: date
        temperatureC:
          type: integer
          format: int32
        summary:
          type: string
          nullable: true
        temperatureF:
          type: integer
          format: int32
          readOnly: true
      additionalProperties: false
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
    apiKeyQuery:
      type: apiKey
      name: subscription-key
      in: query
security:
  - apiKeyHeader: [ ]
  - apiKeyQuery: [ ]
tags:
  - name: WebApplication1