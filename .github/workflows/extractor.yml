name: Run - Extractor

on:
  workflow_dispatch:
    inputs:
      CONFIGURATION_YAML_PATH:
        description: "Extract configuration"
        required: true
        type: choice
        options:
          - Extract All APIs
          - configuration.extractor.yaml

      API_SPECIFICATION_FORMAT:
        description: "API Specification Format"
        required: true
        type: choice
        options:
          - OpenAPIV3Yaml
          - OpenAPIV3Json
          - OpenAPIV2Yaml
          - OpenAPIV2Json

permissions:
  id-token: write
  contents: write

env:
  apiops_release_version: v7.0.4

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run Extractor
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP }}
          API_MANAGEMENT_SERVICE_NAME: ${{ vars.APIM_NAME }}
          API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH: ${{ github.workspace }}/artifacts
          API_SPECIFICATION_FORMAT: ${{ github.event.inputs.API_SPECIFICATION_FORMAT }}
          CONFIGURATION_YAML_PATH: ${{ github.event.inputs.CONFIGURATION_YAML_PATH != 'Extract All APIs' && format('{0}/{1}', github.workspace, github.event.inputs.CONFIGURATION_YAML_PATH) || '' }}

        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $releaseFileName = "extractor-linux-x64.zip"
          $executableFileName = "extractor"

          $uri = "https://github.com/Azure/apiops/releases/download/${{ env.apiops_release_version }}/$releaseFileName"

          Write-Host "Downloading $uri"

          $downloadFilePath = Join-Path "${{ runner.temp }}" $releaseFileName

          Invoke-WebRequest `
            -Uri $uri `
            -OutFile $downloadFilePath

          $extractorFolder = Join-Path "${{ runner.temp }}" "extractor"

          Expand-Archive `
            -Path $downloadFilePath `
            -DestinationPath $extractorFolder `
            -Force

          $extractorPath = Join-Path $extractorFolder $executableFileName

          chmod +x $extractorPath

          Write-Host "Running Extractor..."

          & $extractorPath

          if ($LASTEXITCODE -ne 0) {
            throw "Extractor execution failed."
          }

      - name: Show Extracted Files
        run: |
          find artifacts -type f | head -200
        shell: bash

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Commit Changes
        run: |
          git add artifacts

          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "APIOps extraction"
            git push
          fi
